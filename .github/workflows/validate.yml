name: Validate

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install C headers
        run: |
          sudo apt-get update
          sudo apt-get install --yes libx11-dev libxext-dev libxtst-dev

      - name: Validate repository
        run: make check
